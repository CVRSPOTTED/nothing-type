name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify, lint and build
        run: bash ./gradlew testDebugUnitTest :swipe-research:test lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nothing-type-debug
          path: app/build/outputs/apk/debug/app-debug.apk
  ime:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: bash ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r dev.nothingtype.testing/dev.nothingtype.testing.EditorSmokeInstrumentation | tee ime-api-${{ matrix.api }}.log
            grep -q 'INSTRUMENTATION_CODE: -1' ime-api-${{ matrix.api }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ime-api-${{ matrix.api }}
          path: ime-api-*.log
